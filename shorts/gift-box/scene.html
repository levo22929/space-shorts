<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Bangers; src: url(../../engine/fonts/Bangers-Regular.ttf); }
html, body { margin: 0; background: #fff; }
canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../engine/engine.js"></script>
<script>
// "Choose one box 🎁" — rakibin (im2ylitee) ölçülen zamanlaması: ~13,3 sn hareketsize yakın kutular, sonra sert kesmeyle
// ~1,2 sn hediye ızgarası, sonra sert kesmeyle başa döner. Kısa görünme izleyiciyi tekrar izlemeye/durdurmaya iter.
// Kutu: Flow ürün fotoğrafı (beyaz zemin), 'multiply' ile çizilir; beyaz zemin kaybolur, üst üste binmeler doğal kalır.
// Hediye görselleri: gifts/ altında. Flow görselleri gelince GIFTS[i].img dosya adını değiştirmek yeterli.
const ctx = document.getElementById('c').getContext('2d');
const BOX_IMG = 'box_blue.jpg', ACCENT = '#1f3fa8';   // kutu rengine uyan yazı rengi
const GIFTS = [   // Flow ürün fotoğrafları (beyaz/açık gri zemin); harf = dosya adı
  { letter: 'A', img: 'gifts/A.jpg' }, { letter: 'S', img: 'gifts/S.jpg' },
  { letter: 'M', img: 'gifts/M.jpg' }, { letter: 'K', img: 'gifts/K.jpg' },
  { letter: 'R', img: 'gifts/R.jpg' }, { letter: 'N', img: 'gifts/N.jpg' },
  { letter: 'J', img: 'gifts/J.jpg' }, { letter: 'T', img: 'gifts/T.jpg' },
];
const load = src => new Promise((ok, fail) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => fail(new Error(src)); im.src = src; });
let BOX;
window.ready = Promise.all([load(BOX_IMG).then(im => (BOX = im)), ...GIFTS.map(g => load(g.img).then(im => prepGift(g, im)))]);
// Fotoğrafın kenar rengini ölç (kart zemini olur) ve sağ/sol kenarlarını şeffaflaştır: kartta dikiş görünmesin.
function prepGift(g, im) {
  const n = 512, c = document.createElement('canvas'); c.width = c.height = n; const x = c.getContext('2d');
  x.drawImage(im, 0, 0, n, n);
  const d = x.getImageData(0, 0, n, n).data; let r = 0, gg = 0, b = 0, k = 0;
  for (let i = 0; i < n; i++) for (const [px, py] of [[i, 2], [i, n - 3], [2, i], [n - 3, i]]) { const o = (py * n + px) * 4; r += d[o]; gg += d[o + 1]; b += d[o + 2]; k++; }
  g.bg = `rgb(${Math.round(r / k)},${Math.round(gg / k)},${Math.round(b / k)})`;
  x.globalCompositeOperation = 'destination-out';
  for (const [x0, x1] of [[0, n * 0.14], [n, n * 0.86]]) {
    const lg = x.createLinearGradient(x0, 0, x1, 0); lg.addColorStop(0, 'rgba(0,0,0,1)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = lg; x.fillRect(Math.min(x0, x1), 0, Math.abs(x1 - x0), n);
  }
  g.im = c;
}

const REVEAL = 13.3, END = 14.5;
const CARD_COLORS = ['#ff5fa2', '#2ec4b6', '#9b5de5', '#ff8c42', '#e63946', '#4895ef', '#f4a300', '#06a77d'];
window.DURATION = END;
const COLS = [280, 780], ROWS = [520, 800, 1080, 1360], S = 450;   // kutu görseli çizim boyutu (kare)
const pos = i => [COLS[i % 2], ROWS[Math.floor(i / 2)]];

// Harf animasyonu. Rakipte harfler hep birlikte ~0,84 sn'de bir sönüp yanıyor (kutular sabit). Bizde daha enerjik:
// 80 bpm vuruş, harfler A'dan T'ye dalga halinde zıplar (büyüme + sallanma), vuruşta beyazdan altına parlar, ışık halesi;
// her 4 vuruşta bir kısa, sert sönüp yanma (rakipteki yanıp sönmenin hızlı hali).
const BPM = 80;   // 120 aşırı hızlı bulundu (2026-10-24); rakip ~71
function letter(ch, x, y, t, i) {
  const beat = t * BPM / 60 - i * 0.12;                  // dalga: her harf biraz gecikmeli
  const ph = ((beat % 1) + 1) % 1, kick = Math.exp(-ph * 5);   // vuruşta 1, hızla söner
  const blinkOn = !(((Math.floor(beat) % 4) + 4) % 4 === 3 && ph > 0.55 && ph < 0.8);
  if (!blinkOn) return;
  const sc = 1 + 0.32 * kick, rot = 0.14 * Math.sin(beat * Math.PI) * (0.4 + kick), lift = -18 * kick;
  ctx.save(); ctx.translate(x, y + lift); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.font = 'bold 112px "DejaVu Serif", serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(255,200,40,' + (0.9 * kick).toFixed(3) + ')'; ctx.shadowBlur = 40 * kick;
  ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(10,20,60,0.95)'; ctx.strokeText(ch, 0, 0);
  ctx.shadowBlur = 0; ctx.fillStyle = mixColor('#ffffff', '#ffd23f', Math.min(1, kick * 1.3)); ctx.fillText(ch, 0, 0);
  ctx.restore();
}

function header(sub) {
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = '124px Bangers'; ctx.lineWidth = 16; ctx.strokeStyle = '#ffffff'; ctx.strokeText('CHOOSE ONE BOX', W / 2, 160);
  ctx.fillStyle = ACCENT; ctx.fillText('CHOOSE ONE BOX', W / 2, 160);
  ctx.font = '62px Bangers'; ctx.fillStyle = '#222'; ctx.fillText(sub, W / 2, 262);
  ctx.restore();
}

window.renderAt = (t) => {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  if (t < REVEAL) {
    header('PICK YOUR FIRST LETTER \u{1F447}');
    GIFTS.forEach((g, i) => {
      const [x, y] = pos(i);
      // hafif nefes alma: döngü başında ve açılıştan hemen önce sıfır, böylece kesmeler temiz kalır
      const env = prog(t, 0, 0.5) * (1 - prog(t, REVEAL - 0.4, REVEAL));
      const sc = 1 + env * 0.015 * Math.sin(t * 2.4 + i * 0.8);
      ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
      ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(BOX, -S / 2, -S / 2, S, S);
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
      letter(g.letter, x - S * 0.03, y + S * 0.19, t, i);
    });
  } else {
    header('WHAT DID YOU GET? \u{1F381}');
    const k = prog(t, REVEAL, REVEAL + 0.12, ease.out);
    GIFTS.forEach((g, i) => {
      const [x, y] = pos(i), cw = 470, ch = 270;
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = g.bg; ctx.strokeStyle = CARD_COLORS[i]; ctx.lineWidth = 12;   // zemin = fotoğrafın kenar rengi; renkli kalın çerçeve
      ctx.beginPath(); ctx.roundRect(-cw / 2, -ch / 2, cw, ch, 22); ctx.fill(); ctx.stroke();
      ctx.save(); ctx.clip();
      const s = 300 * (0.92 + 0.08 * k); ctx.drawImage(g.im, -s / 2, -s / 2 + 8, s, s); ctx.restore();
      ctx.beginPath(); ctx.roundRect(-cw / 2, -ch / 2, cw, ch, 22); ctx.stroke();
      ctx.font = 'bold 56px "DejaVu Serif", serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 8; ctx.strokeStyle = '#ffffff'; ctx.strokeText(g.letter, -cw / 2 + 48, -ch / 2 + 46);
      ctx.fillStyle = CARD_COLORS[i]; ctx.fillText(g.letter, -cw / 2 + 48, -ch / 2 + 46);
      ctx.restore();
    });
  }
};
</script></body></html>
